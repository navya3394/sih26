services:
  backend:
    build: ./backend
    environment:
      AYUSETU_JWT_SECRET: ${AYUSETU_JWT_SECRET:-replace-with-a-long-random-secret}
      CORS_ORIGINS: http://localhost:5173
      WHO_CLIENT_ID: ${WHO_CLIENT_ID:-}
      WHO_CLIENT_SECRET: ${WHO_CLIENT_SECRET:-}
    ports:
      - "8000:8000"
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - backend
